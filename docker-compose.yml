version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shms_db
      POSTGRES_USER: shms_user
      POSTGRES_PASSWORD: shms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - shms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shms_user -d shms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shms_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shms.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shms_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:

networks:
  shms_network:
    driver: bridge
